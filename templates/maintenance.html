<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Site Under Maintenance — CTRL A IT HUB</title>
  {% load static %}
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    /* ── Animated stars background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 75%, rgba(255,255,255,0.5) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 56px 48px 48px;
      max-width: 540px;
      width: 90%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      animation: fadeIn 0.8s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo ── */
    .logo-wrap img {
      height: 56px;
      margin-bottom: 28px;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
    }

    /* ── Gear icon ── */
    .gear-wrap {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 24px;
      display: inline-block;
      animation: spin 6s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Text ── */
    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* ── Progress bar (decorative) ── */
    .progress-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      height: 6px;
      margin-bottom: 32px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      animation: progress 4s ease-in-out infinite alternate;
    }
    @keyframes progress {
      from { width: 20%; }
      to   { width: 85%; }
    }

    /* ── Info badges ── */
    .badges {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }
    .badge {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 99px;
      padding: 6px 16px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.75);
    }
    .badge span { margin-right: 5px; }

    /* ── CTA link ── */
    .staff-link {
      display: inline-block;
      margin-top: 4px;
      padding: 10px 28px;
      border-radius: 99px;
      border: 1px solid rgba(167,139,250,0.5);
      color: #a78bfa;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .staff-link:hover {
      background: rgba(167,139,250,0.15);
      color: #c4b5fd;
    }

    .footer-note {
      margin-top: 32px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
    }
    .footer-note a { color: rgba(255,255,255,0.5); text-decoration: none; }
    .footer-note a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="{% static 'images/logo.png' %}" alt="CTRL A IT HUB Logo" />
    </div>

    <!-- Animated gear -->
    <div class="gear-wrap" aria-hidden="true">⚙️</div>

    <h1>We'll Be Right Back!</h1>

    <p class="tagline">
      Our website is currently undergoing scheduled maintenance to bring you<br>
      a better experience. Please check back in a little while.
    </p>

    <!-- Decorative progress bar -->
    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <!-- Info badges -->
    <div class="badges">
      <div class="badge"><span>🔧</span> Maintenance in Progress</div>
      <div class="badge"><span>⏱️</span> Back Soon</div>
      <div class="badge"><span>🔒</span> Secure &amp; Safe</div>
    </div>

    <!-- Staff login bypass -->
    <a href="/login/" class="staff-link">🔑 Staff Login</a>

    <p class="footer-note">
      &copy; {% now "Y" %} CTRL A IT HUB &mdash;
      <a href="mailto:ctrlaithubempoweringtechnology@gmail.com">Contact Us</a>
    </p>

  </div>
</body>
</html>
