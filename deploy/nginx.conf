# ==============================================================================
# Nginx Configuration for CTRL A IT HUB
# Copy to: /etc/nginx/sites-available/ctrla_hub
# Enable with: sudo ln -s /etc/nginx/sites-available/ctrla_hub /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name ctrlaithub.com www.ctrlaithub.com;

    # Allow up to 25MB file uploads for resumes, certificates, and media
    client_max_body_size 25M;

    # Gzip compression for ultra-fast asset loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static files served directly by Nginx
    location /static/ {
        alias /var/www/ctrl_a_it_hub/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Media files (courses, banners, resumes, certificates) served directly by Nginx
    location /media/ {
        alias /var/www/ctrl_a_it_hub/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Reverse proxy to Gunicorn Unix socket
    location / {
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
