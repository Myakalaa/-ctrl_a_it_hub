name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to cPanel via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Starting automatic deployment on server..."
            for d in "/home/ctrlaith/public_html" "/home/ctrlaith/public_html/CTRL_A_IT_HUB" "/home/ctrlaith/CTRL_A_IT_HUB" "/home/ctrlaith/CTRL A IT HUB"; do
              if [ -d "$d/.git" ]; then
                echo "Updating directory: $d"
                cd "$d"
                git fetch origin
                git reset --hard origin/main
                mkdir -p tmp && touch tmp/restart.txt
              fi
            done
            echo "✅ Deployment completed and Python app reloaded successfully!"
